url: https://mlgh-sg.com/epidemia2/
title: epidemia
template:
  params:
    bootswatch: flatly

navbar:
  structure:
    left:  [install, model, articles, reference, news]
    right: [github]
  components:
    home: ~
    install: 
      text: Install
      href: articles/install.html
    model:
      text: Model
      menu: 
      - text: Introduction
        href: articles/model-introduction.html
      - text: Description
        href: articles/model-description.html
      - text: Implementation
        href: articles/model-implementation.html
      - text: Schematic
        href: articles/model-schematic.html
      - text: Partial Pooling
        href: articles/partial-pooling.html
      - text: Priors
        href: articles/priors.html
    articles:
      text: Tutorials
      menu:
      - text: A Basic Example
        href: articles/flu.html
      - text: Multiple Observations
        href: articles/multiple-obs.html
      - text: Multilevel + Multiple Observations
        href: articles/multilevel-multi-obs.html
      - text: Reproducing Flaxman et al. (2020)
        href: articles/flaxman.html
      - text: Transmissibility of a New Variant
        href: articles/b117.html
    news:
      text: News
      href: news/index.html

# pkgdown writes into gh-pages without deleting output it no longer generates,
# so a retired tutorial stays publicly reachable and keeps serving numbers that
# predate the inf2death correction. Redirect it to the tutorial that replaced it
# rather than leaving a stale page or a bare 404 for anyone following an old
# link or a search result.
redirects:
  - ["articles/europe-covid.html", "articles/b117.html"]
