# Re-bake the tutorial vignettes on CI and open a pull request if the rendered
# output changed.
#
# ON DEMAND ONLY. This is deliberately not wired to `push`. Baking means real
# MCMC -- the flaxman tutorial takes hours on a developer
# machine and considerably longer on a shared runner. Running it on every push
# to R/ or data/ exceeded GitHub's six-hour job ceiling and the run was killed
# at 360 minutes having produced nothing.
#
# The routine signal now comes from docs-freshness.yaml, which hashes the inputs
# and reports staleness in about a second without fitting anything. The intended
# fix for stale docs is a LOCAL re-bake (`make tutorials-clean`), on hardware
# suited to it. This workflow exists for the times you would rather CI did it
# anyway -- so it is manual, plus a weekly run that acts as a backstop against
# drift from dependency updates (a new CmdStan or R release can move numbers
# even when nothing in this repo changed).
#
# Each tutorial is a SEPARATE job. A single job baking all of them cannot fit in
# six hours; one job per tutorial gives each its own budget and lets them run in
# parallel, so wall-clock is the slowest single tutorial rather than the sum.
on:
  workflow_dispatch:
    inputs:
      tutorials:
        description: 'Which tutorials to bake (JSON array, or "all")'
        required: false
        default: 'all'
  schedule:
    - cron: '0 5 * * 1'   # Mondays 05:00 UTC -- backstop against dependency drift

name: refresh-vignettes

permissions:
  contents: write
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: |
          req='${{ github.event.inputs.tutorials }}'
          if [ -z "$req" ] || [ "$req" = "all" ]; then
            # keep in step with all_vigs in vignettes/precompute.R
            echo 'matrix=["flu","multiple-obs","multilevel-multi-obs","flaxman","b117"]' >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$req" >> "$GITHUB_OUTPUT"
          fi

  bake:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false          # one slow tutorial must not discard the others
      matrix:
        tutorial: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Configure repositories (cmdstanr lives on the Stan r-universe)
        run: |
          cat("options(repos = c(stan = 'https://stan-dev.r-universe.dev', getOption('repos')))\n",
              file = "~/.Rprofile", append = TRUE)
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # cmdstanr + everything the tutorials need to actually fit and knit
          extra-packages: |
            any::cmdstanr
            any::pkgload
            any::rprojroot
            any::knitr
            any::bookdown
            any::EpiEstim
            any::lubridate
            any::dplyr
            any::kableExtra
            any::gridExtra
            any::extrafont
            local::.

      # Install + cache CmdStan into cmdstanr's default location so the fresh R
      # sessions that knit the vignettes auto-detect it.
      - name: Cache CmdStan
        id: cmdstan-cache
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ runner.os }}-2.36.0

      - name: Install CmdStan
        if: steps.cmdstan-cache.outputs.cache-hit != 'true'
        run: |
          cmdstanr::check_cmdstan_toolchain(fix = TRUE)
          cmdstanr::install_cmdstan(version = "2.36.0", cores = parallel::detectCores())
        shell: Rscript {0}

      # --force is required, not optional. precompute.R skips a tutorial whose
      # baked output is newer than its sources, but git does not preserve
      # mtimes, so on a fresh checkout every file has essentially the same
      # timestamp and the comparison is meaningless -- it would skip or bake
      # arbitrarily. This job exists to detect drift by actually refitting, so
      # it always rebuilds (which also drops the knitr cache).
      #
      # A single tutorial is named, so precompute.R will NOT update the docs
      # stamp -- a stamp written after a partial bake would overstate freshness.
      # The collect job records it once every tutorial has been rebuilt.
      - name: Re-bake ${{ matrix.tutorial }}
        run: Rscript vignettes/precompute.R --force ${{ matrix.tutorial }}

      - uses: actions/upload-artifact@v4
        with:
          name: baked-${{ matrix.tutorial }}
          path: |
            vignettes/${{ matrix.tutorial }}.Rmd
            vignettes/figure/${{ matrix.tutorial }}-*
            vignettes/*.png
          if-no-files-found: warn
          retention-days: 7

  collect:
    needs: bake
    if: always() && needs.bake.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/baked
          merge-multiple: false

      - name: Apply the baked outputs
        run: |
          shopt -s nullglob
          for d in /tmp/baked/baked-*; do
            [ -d "$d" ] || continue
            echo "applying $(basename "$d")"
            cp -R "$d"/. .
          done
          git status --short

      # Only meaningful once EVERY tutorial has been rebuilt; a stamp recorded
      # after a partial run would claim more freshness than it has.
      - name: Record the docs stamp
        if: needs.bake.result == 'success'
        run: ./tools/docs-stamp.sh write r

      # Needs "Allow GitHub Actions to create and approve pull requests" under
      # Settings -> Actions -> General -> Workflow permissions (and the same at
      # org level if the org enforces it). Without it this step fails with
      # "GitHub Actions is not permitted to create or approve pull requests"
      # AFTER pushing the branch, so the refreshed output is still available on
      # auto/refresh-vignettes even when the PR cannot be opened.
      - name: Open a PR if the baked vignettes changed
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: |
            vignettes/*.Rmd
            vignettes/figure/**
            vignettes/*.png
            .docs-stamp
          branch: auto/refresh-vignettes
          delete-branch: true
          title: "Refresh precomputed vignette outputs"
          commit-message: "Refresh precomputed vignette outputs (re-baked by CI)"
          body: |
            The tutorial vignettes were re-baked by `vignettes/precompute.R`.
            Review the updated plots and numbers, then merge to publish.

            Check the sampler diagnostics in the diff before merging: a tutorial
            that re-baked with new divergences or a worse R-hat should not be
            published just because it ran.

            *Opened automatically by the `refresh-vignettes` workflow.*
