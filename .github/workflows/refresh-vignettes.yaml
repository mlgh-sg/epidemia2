# Re-bake (precompute) the model-fitting tutorial vignettes and open a pull
# request if their rendered output changed.
#
# The documentation site renders committed, precomputed vignettes so it can
# build quickly without CmdStan. This workflow keeps those precomputed outputs
# from going stale: whenever the modelling code (R/, inst/stan/) or a tutorial
# source (*.Rmd.orig / precompute.R) changes, it refits the models by running
# vignettes/precompute.R and, if the baked .Rmd files or figures differ, opens
# a PR with the refreshed docs for review.
#
# It can also be run on demand (workflow_dispatch) or on a weekly schedule.
on:
  push:
    branches: [main, master]
    paths:
      - 'R/**'
      - 'inst/stan/**'
      - 'vignettes/*.Rmd.orig'
      - 'vignettes/precompute.R'
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'   # Mondays 05:00 UTC

name: refresh-vignettes

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    concurrency:
      group: refresh-vignettes
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Configure repositories (cmdstanr lives on the Stan r-universe)
        run: |
          cat("options(repos = c(stan = 'https://stan-dev.r-universe.dev', getOption('repos')))\n",
              file = "~/.Rprofile", append = TRUE)
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # cmdstanr + everything the tutorials need to actually fit and knit
          extra-packages: |
            any::cmdstanr
            any::pkgload
            any::rprojroot
            any::knitr
            any::bookdown
            any::EpiEstim
            any::lubridate
            any::dplyr
            any::kableExtra
            any::gridExtra
            any::extrafont
            local::.

      # Install + cache CmdStan into cmdstanr's default location so the fresh R
      # sessions that knit the vignettes auto-detect it.
      - name: Cache CmdStan
        id: cmdstan-cache
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ runner.os }}-2.36.0

      - name: Install CmdStan
        if: steps.cmdstan-cache.outputs.cache-hit != 'true'
        run: |
          cmdstanr::check_cmdstan_toolchain(fix = TRUE)
          cmdstanr::install_cmdstan(version = "2.36.0", cores = parallel::detectCores())
        shell: Rscript {0}

      - name: Re-bake the tutorial vignettes
        run: Rscript vignettes/precompute.R

      - name: Open a PR if the baked vignettes changed
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: |
            vignettes/*.Rmd
            vignettes/figure/**
          branch: auto/refresh-vignettes
          delete-branch: true
          title: "Refresh precomputed vignette outputs"
          commit-message: "Refresh precomputed vignette outputs (re-baked by CI)"
          body: |
            The modelling code or a tutorial source changed, so the precomputed
            (baked) tutorial vignettes were regenerated by
            `vignettes/precompute.R`. Review the updated plots and numbers, then
            merge to publish the refreshed documentation.

            *Opened automatically by the `refresh-vignettes` workflow.*
