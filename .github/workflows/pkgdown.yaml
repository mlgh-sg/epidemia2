# Build and deploy the pkgdown documentation site.
#
# The tutorial vignettes fit real Stan models, so the runner needs a working
# CmdStan installation (installed and cached below). The site is published to
# the gh-pages branch; after the first successful run, enable GitHub Pages once
# under Settings -> Pages -> "Deploy from a branch" -> gh-pages / (root).
on:
  push:
    branches: [main, master]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # non-PR events share one group so a newer run cancels an older in-flight
    # one (avoids two builds racing to deploy gh-pages); PR runs stay distinct.
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
      cancel-in-progress: true
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # cmdstanr lives on the Stan r-universe; add it so the Suggests resolves.
      - name: Configure repositories
        run: |
          cat("options(repos = c(stan = 'https://stan-dev.r-universe.dev', getOption('repos')))\n",
              file = "~/.Rprofile", append = TRUE)
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # website deps + cmdstanr + the vignette Suggests + the package itself
          # website deps + cmdstanr + everything the tutorial vignettes need
          extra-packages: |
            any::pkgdown
            any::cmdstanr
            any::tinytex
            any::magick
            any::pdftools
            any::EpiEstim
            any::lubridate
            any::kableExtra
            any::gridExtra
            any::bookdown
            any::extrafont
            local::.
          needs: website

      - name: Install a LaTeX toolchain (for the schematic vignette)
        run: tinytex::install_tinytex()
        shell: Rscript {0}

      # Install + cache CmdStan (the slow part) into cmdstanr's DEFAULT location
      # (~/.cmdstan/cmdstan-<version>). Installing there means cmdstanr auto-
      # detects it in every subprocess, including the fresh R sessions pkgdown
      # spawns to knit the (model-fitting) vignettes. The cache key pins the
      # version so a toolchain bump invalidates it automatically.
      - name: Cache CmdStan
        id: cmdstan-cache
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ runner.os }}-2.36.0

      - name: Install CmdStan
        if: steps.cmdstan-cache.outputs.cache-hit != 'true'
        run: |
          cmdstanr::check_cmdstan_toolchain(fix = TRUE)
          cmdstanr::install_cmdstan(version = "2.36.0", cores = parallel::detectCores())
        shell: Rscript {0}

      - name: Check CmdStan is discoverable
        run: cat("CmdStan:", cmdstanr::cmdstan_path(), "/", as.character(cmdstanr::cmdstan_version()), "\n")
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
