# Build and deploy the pkgdown documentation site.
#
# This job does NOT fit any models: the model-fitting tutorials are precomputed
# (baked) by vignettes/precompute.R and committed, so the site renders quickly
# and needs no CmdStan. When the modelling code changes, the separate
# "refresh-vignettes" workflow re-bakes the tutorials and opens a PR.
#
# The site is published to the gh-pages branch; after the first successful run,
# enable GitHub Pages once under Settings -> Pages -> "Deploy from a branch"
# -> gh-pages / (root).
on:
  push:
    branches: [main, master]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # non-PR events share one group so a newer run cancels an older in-flight
    # one (avoids two builds racing to deploy gh-pages); PR runs stay distinct.
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
      cancel-in-progress: true
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # cmdstanr is a Suggests and lives on the Stan r-universe. The docs build
      # does not fit anything (tutorials are baked, examples are \dontrun), but
      # dependency resolution still needs to find and install the cmdstanr R
      # package. CmdStan itself is never installed here.
      - name: Configure repositories
        run: |
          cat("options(repos = c(stan = 'https://stan-dev.r-universe.dev', getOption('repos')))\n",
              file = "~/.Rprofile", append = TRUE)
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # website deps + what the conceptual articles need to render. No
          # cmdstanr: the tutorials are already baked, so nothing is fit here.
          extra-packages: |
            any::pkgdown
            any::tinytex
            any::magick
            any::pdftools
            any::bookdown
            any::kableExtra
            local::.
          needs: website

      - name: Install a LaTeX toolchain (for the schematic vignette)
        run: tinytex::install_tinytex()
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
