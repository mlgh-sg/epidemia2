# Build and deploy the pkgdown documentation site.
#
# This build fits models live so that everything renders with real output: the
# reference examples (\donttest) and any article that fits (e.g. the model
# implementation vignette) are run during the build, so CmdStan is installed and
# cached here. The heavy tutorials are still precomputed by
# vignettes/precompute.R (committed), so only the small examples are refit; the
# separate "refresh-vignettes" workflow keeps the tutorials up to date.
#
# The site is published to the gh-pages branch; after the first successful run,
# enable GitHub Pages once under Settings -> Pages -> "Deploy from a branch"
# -> gh-pages / (root).
on:
  push:
    branches: [main, master]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # non-PR events share one group so a newer run cancels an older in-flight
    # one (avoids two builds racing to deploy gh-pages); PR runs stay distinct.
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
      cancel-in-progress: true
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Configure repositories (cmdstanr lives on the Stan r-universe)
        run: |
          cat("options(repos = c(stan = 'https://stan-dev.r-universe.dev', getOption('repos')))\n",
              file = "~/.Rprofile", append = TRUE)
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # website + cmdstanr + everything the live examples/articles need
          extra-packages: |
            any::pkgdown
            any::cmdstanr
            any::tinytex
            any::magick
            any::pdftools
            any::bookdown
            any::kableExtra
            any::EpiEstim
            any::lubridate
            any::dplyr
            any::gridExtra
            any::extrafont
            local::.
          needs: website

      - name: Install a LaTeX toolchain (for the schematic vignette)
        run: tinytex::install_tinytex()
        shell: Rscript {0}

      # Install + cache CmdStan into cmdstanr's default location so the fresh R
      # sessions that pkgdown spawns (reference examples, the model-implementation
      # vignette) can fit models. The key pins the version so a toolchain bump
      # invalidates the cache automatically.
      - name: Cache CmdStan
        id: cmdstan-cache
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ runner.os }}-2.36.0

      - name: Install CmdStan
        if: steps.cmdstan-cache.outputs.cache-hit != 'true'
        run: |
          cmdstanr::check_cmdstan_toolchain(fix = TRUE)
          cmdstanr::install_cmdstan(version = "2.36.0", cores = parallel::detectCores())
        shell: Rscript {0}

      - name: Check CmdStan is discoverable
        run: cat("CmdStan:", cmdstanr::cmdstan_path(), "\n")
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
