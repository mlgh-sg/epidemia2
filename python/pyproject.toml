[project]
name = "epidemia"
version = "0.1.0"
description = "Bayesian semi-mechanistic modelling of infectious diseases (renewal processes) in PyMC, fit with the fast nutpie (NUTS) sampler. Python counterpart of the R package 'epidemia'."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "GPL-3.0-or-later" }
authors = [
  { name = "Swapnil Mishra", email = "swapnilmishra.anu@gmail.com" },
]
maintainers = [
  { name = "Swapnil Mishra", email = "swapnilmishra.anu@gmail.com" },
]
keywords = ["epidemiology", "bayesian", "renewal-process", "reproduction-number", "pymc", "nutpie"]
dependencies = [
  "pymc>=5.16",       # model specification (PyTensor)
  "nutpie>=0.13",     # fast Rust NUTS sampler -> ArviZ InferenceData
  "numba>=0.59",      # CPU compilation backend for the log-density
  "numpy>=1.24",
  "arviz>=0.18",
  "plotnine>=0.13",   # grammar-of-graphics plotting (ggplot2 for Python)
  "pandas>=2.0",      # panel data for the multilevel (Europe COVID) example
  "scipy>=1.10",      # probit link; already a pymc dependency, declared so it is not transitive
]

# NOTE: keep [project.urls] and every other sub-table BELOW the key/value pairs
# above. A `[table]` header captures everything after it, so putting it earlier
# silently reparents `dependencies` into it and the build fails.
[project.urls]
Homepage = "https://mlgh-sg.com/epidemia2/"
Repository = "https://github.com/mlgh-sg/epidemia2"
Issues = "https://github.com/mlgh-sg/epidemia2/issues"
"Original R package" = "https://github.com/ImperialCollegeLondon/epidemia"
"Software paper (Scott et al. 2021)" = "https://arxiv.org/abs/2110.12461"

[project.optional-dependencies]
# Linux + NVIDIA GPU: compile the log-density with the JAX backend and run on GPU.
#   uv sync --extra gpu   (then fit(..., backend="jax"))
gpu = ["jax[cuda12]>=0.4.34; sys_platform == 'linux'"]
# Normalizing-flow ("Fisher HMC") adaptation for hard posteriors.
#   uv sync --extra flow  (then fit(..., adaptation="flow"))
flow = ["nutpie[nnflow]>=0.13"]

[project.scripts]
epidemia-flu = "epidemia.examples.flu:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
  "jupytext>=1.16",   # pair the example notebooks (.py <-> .ipynb)
  "nbconvert>=7.0",   # execute notebooks headless (jupytext --execute)
  "ipykernel>=6.0",   # the Python kernel nbconvert runs cells in
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epidemia"]
artifacts = ["src/epidemia/data_files/*.csv"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: fits a model; deselect with -m 'not slow'",
]
