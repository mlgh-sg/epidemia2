[project]
name = "epidemia"
version = "0.1.0"
description = "Bayesian semi-mechanistic modelling of infectious diseases (renewal processes) in JAX, with NumPyro model specification and a fast nutpie / BlackJAX (NUTS) sampler backend. Python counterpart of the R package 'epidemia'."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "GPL-3.0-or-later" }
authors = [
  { name = "epidemia authors" },
]
keywords = ["epidemiology", "bayesian", "renewal-process", "reproduction-number", "jax", "numpyro", "nutpie"]
dependencies = [
  "jax>=0.4.34",          # CPU everywhere; this is the optimized default on Apple Silicon
  "numpyro>=0.15",        # model specification; sampled with NumPyro NUTS by default
  "blackjax>=1.2",        # alternative JAX sampler backend
  "numpy>=1.24",
  "arviz>=0.18",
  "plotnine>=0.13",       # grammar-of-graphics plotting (ggplot2 for Python)
]

[project.optional-dependencies]
# Fast Rust NUTS via an equivalent PyMC model:  uv sync --extra nutpie
# (nutpie front-ends PyMC/Stan, not NumPyro; pulls pymc + numba)
nutpie = ["nutpie>=0.13", "pymc>=5.16", "numba>=0.59"]
# Linux + NVIDIA GPU:  uv sync --extra cuda   (the marker makes it a no-op off Linux)
cuda = ["jax[cuda12]>=0.4.34; sys_platform == 'linux'"]
# Apple Silicon Metal — EXPERIMENTAL and NOT recommended for this model: jax-metal
# lacks float64 and segfaults on lax.scan (our renewal core). Prefer the CPU default.
metal = [
  "jax-metal>=0.1.1; sys_platform == 'darwin'",
  "jax==0.4.34; sys_platform == 'darwin'",
]

[project.scripts]
epidemia-flu = "epidemia.examples.flu:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "pdoc>=14",
]

[tool.uv]
# cuda and metal pin JAX differently and never coexist; declare them conflicting so
# the universal lockfile resolves each branch independently instead of failing.
conflicts = [
  [{ extra = "cuda" }, { extra = "metal" }],
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epidemia"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
