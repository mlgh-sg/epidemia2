site_name: epidemia (Python)
site_description: Bayesian semi-mechanistic renewal-process modelling of infectious diseases, in PyMC + nutpie.
site_url: https://mlgh-sg.com/epidemia2/python/
repo_url: https://github.com/mlgh-sg/epidemia2
repo_name: mlgh-sg/epidemia2
docs_dir: docs
site_dir: site

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            docstring_section_style: table
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [docs]

nav:
  - Home: index.md
  - User guide: guide.md
  - Tutorials:
      - Overview: tutorials.md
      - Assessing the effects of interventions: tutorials/europe-covid.md
      - Partial pooling: tutorials/partial-pooling.md
      - Several observation series: tutorials/multilevel-multi-obs.md
  - Parity with R: parity.md
  - Performance: performance.md
  - API reference: reference.md
