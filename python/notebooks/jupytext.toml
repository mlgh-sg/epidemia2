# Jupytext configuration for the example notebooks.
# The notebooks are stored as plain .py files in the "percent" format (cells are
# delimited by `# %%`). Pair them with .ipynb on the fly:
#
#   uv run jupytext --to notebook b117.py     # create .ipynb
#   uv run jupytext --sync b117.py            # keep .py and .ipynb in sync
#   uv run jupytext --execute --to notebook b117.py   # run and save outputs
#
# With this config, opening a .py notebook in Jupyter/VS Code and saving it will
# keep a paired .ipynb (git-ignored) up to date, while the .py stays the source
# of truth under version control.
formats = "py:percent,ipynb"
notebook_metadata_filter = "-all"
cell_metadata_filter = "-all"
